---
name: ci

"on":
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync uv dependencies
        run: uv sync

      - name: Make Lint
        run: make lint

      # - name: Super-Linter
      #   uses: super-linter/super-linter@v9.0.0

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync uv dependencies
        run: uv sync

      - name: Run tests
        run: make test

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run security checks
        run: make security
