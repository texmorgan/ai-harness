# powers/_index.yaml
# A "power" is a role a given agent can assume.
# Each power composes one or more skills and is
# constrained by steering docs.
#
# hierarchy:  steering > power > skill

version: 1

powers:
  - id: architect
    file: architect.md
    composes:
      skills: [migration, security-scan]
      conventions: [api-design, naming]
    permissions:
      - propose system designs
      - flag architectural debt
      - veto non-conformant API changes
    not_permitted:
      - deploy to production
      - modify secrets or vault config

  - id: reviewer
    file: reviewer.md
    composes:
      skills: [code-review, security-scan]
      conventions: [error-handling, testing]
    permissions:
      - flag blockers on a PR
      - request changes
      - approve merge for non-payment paths
    not_permitted:
      - approve payment or auth path changes
        without security-auditor sign-off

  - id: incident-commander
    file: incident-commander.md
    composes:
      skills: [incident-response, security-scan]
      conventions: [error-handling]
    permissions:
      - declare severity
      - trigger rollback
      - page on-call
    not_permitted:
      - root-cause analysis (that's a
        post-incident task, not a live one)

  - id: onboarding-buddy
    file: onboarding.md
    composes:
      skills: []
      conventions: [naming, testing]
    permissions:
      - answer "how do I…" questions
      - point to steering/ and docs/
    not_permitted:
      - modify any file in the repo

  - id: security-auditor
    file: security-auditor.md
    composes:
      skills: [security-scan]
      conventions: [error-handling]
    permissions:
      - scan for vulns
      - flag PCI scope violations
      - block a deploy
    not_permitted:
      - fix the vuln (flag it, route it)
